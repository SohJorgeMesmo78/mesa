<div class="play-page" style="--game-accent:#38a889"><header class="play-header shell"><app-brand-logo [compact]="true"/><a routerLink="/jogos/adivinhe-a-palavra" (click)="leave()">Sair</a></header><main class="play-main shell">@if(game();as g){<section class="stage"><p class="eyebrow">A letra inicial é</p><div class="secret">{{g.letter}}</div><div class="rule"><strong>Construam uma palavra, letra por letra.</strong><p>Na sua vez, acrescente uma letra. Perde quem completar uma palavra. Se a sequência parecer impossível, diga “Duvido”: a pessoa anterior precisa provar uma palavra válida.</p></div><button class="button button--primary button--large" (click)="newRound()">Nova rodada</button><a class="button button--secondary button--large" routerLink="/" fragment="jogos" (click)="leave()">Jogar outro jogo</a></section>}</main></div>
